[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intergate-v8"
version = "8.1.0"
description = "Prior-constrained subtype graph learning for breast cancer"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "torch>=2.5,<2.8",
  "torch-geometric>=2.6,<3",
  "networkx>=3.2,<4",
]

[tool.setuptools.packages.find]
include = ["intergate*"]
