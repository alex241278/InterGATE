[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intergate-reproducibility"
version = "6.0.0"
description = "Biology-first supervised sparse interactome learning for transcriptomic subtypes"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}
authors = [
  {name = "Lucia Alvarez-Frutos"},
  {name = "Laura Senovilla"},
  {name = "Alejandro Alvaro-Meca", email = "alejandro.alvaro@urjc.es"},
]
keywords = [
  "graph neural networks",
  "transcriptomics",
  "breast cancer",
  "network biology",
  "reproducibility",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "joblib>=1.3,<2",
  "networkx>=3.2,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "requests>=2.31,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "torch>=2.3,<3",
  "xgboost>=2,<4",
]

[project.optional-dependencies]
full = [
  "GEOparse>=2.0,<3",
  "inmoose>=0.9,<1",
  "ipykernel>=6,<7",
  "jupyterlab>=4,<5",
  "matplotlib>=3.8,<4",
  "mygene>=3.2,<4",
  "nbclient>=0.10,<1",
  "nbconvert>=7,<8",
  "nbformat>=5.10,<6",
  "seaborn>=0.13,<1",
]
test = [
  "pytest>=8,<9",
]

[project.urls]
Repository = "https://github.com/alex241278/InterGATE"

[tool.setuptools.packages.find]
include = ["intergate*"]
